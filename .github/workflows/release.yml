name: Release

# Two ways to make a release:
# - Actions tab -> Release -> Run workflow, with "publish" ticked. The version
#   defaults to contentVersion in ps5/title/sce_sys/param.json; the run builds
#   the selected branch, then creates the tag at that commit and the release.
# - Push a tag NN.NNN.NNN; the release is published for that tag.
# A manual run without "publish" only builds and keeps the ZIP as a run artifact.

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag NN.NNN.NNN (empty: contentVersion from param.json)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Create the tag and publish the GitHub release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the published release as a pre-release'
        required: false
        default: true
        type: boolean
      clean:
        description: 'Discard the persistent compiled-output cache before building'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve and check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          content=$(python3 -c 'import json; print(json.load(open("ps5/title/sce_sys/param.json"))["contentVersion"])')
          if [[ $EVENT == push ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=${INPUT_VERSION:-$content}
          fi
          if [[ ! $tag =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]]; then
            echo "::error::version '$tag' is not NN.NNN.NNN"; exit 1
          fi
          if [[ $tag != "$content" ]]; then
            echo "::error::version $tag differs from contentVersion $content in ps5/title/sce_sys/param.json"; exit 1
          fi
          if [[ $EVENT == workflow_dispatch && $PUBLISH == true ]]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::tag $tag already exists; raise contentVersion for a new release"; exit 1
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::error::release $tag already exists"; exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release version: $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    env:
      SOURCE_ROOT: ${{ github.workspace }}/sources
      PRODUCT: ${{ github.workspace }}/sources/ps5-proton/ps5-runescape
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      FOREVER_BUILD_CACHE: ${{ github.workspace }}/sources/.cache
      FOREVER_CLEAN_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.clean && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sources/ps5-proton/ps5-runescape
          persist-credentials: false
      - name: Check build disk
        run: |
          # Never remove preinstalled tools from a persistent self-hosted machine.
          python3 -c 'import os, shutil; free = shutil.disk_usage(os.environ["GITHUB_WORKSPACE"]).free; print(f"Build disk available: {free // (1 << 30)} GiB"); assert free >= 30 << 30, "release build requires at least 30 GiB free"'
      - name: Check out pinned public sources
        run: python3 "$PRODUCT/ps5/release/fetch-sources.py" "$SOURCE_ROOT"
      - name: Build and qualify both title roles in the pinned container
        env:
          JOBS: ${{ vars.FOREVER_JOBS }}
        run: bash "$PRODUCT/ps5/release/build-linux.sh" "$SOURCE_ROOT" "$RELEASE_TAG"
      - name: Verify archive and write its catalog digest
        working-directory: sources/ps5-proton/ps5-runescape/ps5/build/release
        run: |
          python3 -m zipfile --test PPSA99225.zip
          sha256sum PPSA99225.zip > PPSA99225.zip.sha256
      - name: Retain the exact release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            sources/ps5-proton/ps5-runescape/ps5/build/release/PPSA99225.zip
            sources/ps5-proton/ps5-runescape/ps5/build/release/PPSA99225.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release-artifact
      - name: Publish the release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: |
          cd release-artifact
          sha256sum --check PPSA99225.zip.sha256
          cd ..
          python3 -c 'from pathlib import Path; text = Path("ps5/release/catalog-notes.md").read_text(); marker = "## Release notes (GitHub release description, shown by the catalog)"; Path("release-artifact/notes.md").write_text(text.split(marker, 1)[1].strip() + "\n")'
          product_name=$(python3 -c 'import json; p=json.load(open("ps5/title/sce_sys/param.json"))["localizedParameters"]; print(p[p["defaultLanguage"]]["titleName"])')
          args=(--title "$product_name $RELEASE_TAG" --notes-file release-artifact/notes.md)
          if [[ $EVENT == push ]]; then
            args+=(--verify-tag)
          else
            # Creates the tag at the exact commit this run built.
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ $PRERELEASE == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            release-artifact/PPSA99225.zip release-artifact/PPSA99225.zip.sha256
